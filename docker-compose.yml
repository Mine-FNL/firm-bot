# firm-bot + Ollama side-by-side.
#
# Bring up:
#     docker compose up -d
#
# Then open http://localhost:7860.
#
# On first boot, firm-bot auto-pulls `qwen2.5-coder:1.5b-instruct`
# (~1 GB) into Ollama. Override `FIRM_BOT_LLM_MODEL` to use a larger
# model — e.g. `qwen2.5-coder:14b` (~9 GB) for production answers.
#
# Data is persisted under ./data on the host.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: firm-bot-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11434/api/tags"]
      interval: 10s
      timeout: 3s
      retries: 12

  firm-bot:
    build: .
    container_name: firm-bot
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      FIRM_BOT_OLLAMA_HOST: http://ollama:11434
      FIRM_BOT_DATA_DIR: /app/data
      # Small, fast default — auto-pulled on first boot.
      # Set FIRM_BOT_LLM_MODEL=qwen2.5-coder:14b for production.
      FIRM_BOT_LLM_MODEL: ${FIRM_BOT_LLM_MODEL:-qwen2.5-coder:1.5b-instruct}
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data

volumes:
  ollama-data: