name: Bench

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 06:00 UTC to catch regressions in
    # upstream deps (chromadb, sentence-transformers, prometheus_client).
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  load:
    name: Load benchmark + RAGAS smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install firm-bot (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,observability]"
      - name: Lint gate
        run: |
          ruff check firm_bot eval tests
          mypy firm_bot eval
      - name: Run unit tests (incl. RAGAS, security, observability)
        run: pytest tests -q
      - name: Run load benchmark smoke
        env:
          FIRM_BOT_RUN_LOAD_BENCH: "1"
        run: pytest tests/test_load.py -v
      - name: Upload load benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-bench-results
          path: |
            eval/load_results.json
            eval/load_results.md
            eval/ragas_results.json
            eval/ragas_results.md
          if-no-files-found: ignore