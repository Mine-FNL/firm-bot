name: docker-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-smoke:
    name: docker compose up + demo init + curl /healthz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CI runner doesn't ship docker compose v2 by default in every
      # image; install it if missing.
      - name: Ensure docker compose plugin
        run: |
          if ! docker compose version 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi
          docker compose version

      - name: Bring up the stack (firm-bot + Ollama)
        run: docker compose up -d
        env:
          FIRM_BOT_LLM_MODEL: qwen2.5-coder:1.5b-instruct

      # The default model is small (~1 GB) but on a fresh CI runner
      # the pull can still take a few minutes. We bound it to 10 min.
      - name: Wait for firm-bot to become healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7860/healthz || echo 000)
            if [ "$code" = "200" ]; then
              echo "firm-bot is up after ${i}*10s"
              exit 0
            fi
            echo "  attempt $i: http=$code"
            sleep 10
          done
          echo "::error::firm-bot never became healthy"
          docker compose logs
          exit 1

      - name: Verify /healthz payload
        run: |
          curl -fsS http://localhost:7860/healthz
          echo ""

      - name: Verify /v1/firms is reachable
        run: |
          body=$(curl -fsS http://localhost:7860/v1/firms)
          echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'firms' in d, d; print('firms endpoint ok')"

      - name: Tear down
        # Use -v to also wipe the persistent Ollama volume so the next
        # CI run starts from a clean state.
        run: docker compose down -v
        if: always()
